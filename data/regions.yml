# Regional VC Capital Allocation Data
# Thoth (Data Acquisition) - 2025-11-02
#
# Sources: PitchBook (2023-2024), NVCA Yearbook 2024, Carta State of Private Markets
# Note: These are estimates based on publicly available data. Will be replaced with
# exact figures when proprietary data access is available.

regions:
  bay_area:
    name: "San Francisco Bay Area"
    # Includes: SF, San Jose, Oakland, Peninsula, South Bay
    budget_share: 0.524  # Bay Area ≈42–45% of US VC, normalized to 4-region sim (was 0.44)
    annual_capital_bn: 104.8  # Billions USD, consistent with 52.4% of $200B total

    # Feature weights for scoring function
    weights:
      revenue: 0.6
      growth: 0.8
      charisma: 1.2        # Bay Area values vision/charisma highly
      vision: 1.5          # Strong preference for "big vision"
      traction_quality: 0.7
      repeat_founder: 1.1
      geo_flex: 0.3

    # Domain preferences (multipliers)
    domain_preferences:
      ai: 1.8              # Strong AI preference
      bio: 0.9
      consumer: 1.0
      enterprise: 1.1

    # Hype sensitivity (β_region)
    hype_beta: 1.5         # High hype elasticity

    # Stage mix
    stage_mix:
      seed: 0.25
      series_a: 0.35
      series_b_plus: 0.40

    # Average check size by stage (millions USD) - base means
    check_sizes:
      seed: 2.8
      series_a: 14.0
      series_b_plus: 38.0

    # Lognormal sigma for stochastic check sizes
    check_sigma:
      seed: 0.35
      series_a: 0.30
      series_b_plus: 0.25

    # Domain-specific cost multipliers
    domain_mult:
      ai: 1.20
      bio: 1.05
      consumer: 1.00
      enterprise: 1.00

    notes: |
      Bay Area remains dominant in VC with ~44% of capital. Strong preference for
      AI/ML infrastructure, narrative-driven founders, and "category-defining" visions.
      Tolerant of pre-revenue companies with strong team pedigree.
      Source: PitchBook Q4 2024, NVCA 2024 Yearbook, CBRE 2024

  nyc:
    name: "New York City"
    budget_share: 0.238  # NYC ≈18–22%, normalized to 4-region sim (was 0.20)
    annual_capital_bn: 47.6  # Billions USD, consistent with 23.8% of $200B total

    weights:
      revenue: 1.4         # NYC values revenue highly
      growth: 1.2
      charisma: 0.7
      vision: 0.6
      traction_quality: 1.3
      repeat_founder: 0.9
      geo_flex: 0.4

    domain_preferences:
      ai: 1.0
      bio: 0.7
      consumer: 1.1
      enterprise: 1.5      # Strong enterprise/fintech preference

    hype_beta: 0.8         # Moderate hype elasticity

    stage_mix:
      seed: 0.20
      series_a: 0.35
      series_b_plus: 0.45

    check_sizes:
      seed: 2.2
      series_a: 12.0
      series_b_plus: 36.0

    check_sigma:
      seed: 0.30
      series_a: 0.28
      series_b_plus: 0.22

    domain_mult:
      ai: 1.05
      bio: 1.00
      consumer: 0.95
      enterprise: 1.05

    notes: |
      NYC ecosystem emphasizes fundamentals, revenue, and enterprise/fintech domains.
      More risk-averse than Bay Area; prefers proven business models with clear paths
      to profitability. Strong media/advertising tech presence.
      Source: PitchBook NYC Market Report 2024, Carta 2024

  boston:
    name: "Boston/Cambridge"
    budget_share: 0.131  # Boston ≈10–12%, normalized to 4-region sim (was 0.11)
    annual_capital_bn: 26.2  # Billions USD, consistent with 13.1% of $200B total

    weights:
      revenue: 1.1
      growth: 1.0
      charisma: 0.5
      vision: 0.7
      traction_quality: 1.4  # Values scientific traction
      repeat_founder: 1.3    # Strong repeat founder preference
      geo_flex: 0.5

    domain_preferences:
      ai: 1.0
      bio: 2.0             # Very strong bio/life sciences preference
      consumer: 0.6
      enterprise: 1.2

    hype_beta: 0.5         # Low hype elasticity (most conservative)

    stage_mix:
      seed: 0.20
      series_a: 0.40
      series_b_plus: 0.40

    check_sizes:
      seed: 1.8
      series_a: 10.5
      series_b_plus: 28.0

    check_sigma:
      seed: 0.28
      series_a: 0.25
      series_b_plus: 0.20

    domain_mult:
      ai: 1.00
      bio: 1.15
      consumer: 0.90
      enterprise: 1.00

    notes: |
      Boston/Cambridge ecosystem built around MIT, Harvard, and strong life sciences
      institutions. Conservative, science-driven investing with lower hype sensitivity.
      Emphasis on technical depth, publications, and academic pedigree.
      Source: MassTech Venture Capital Report 2024, NVCA Q4 2024

  la:
    name: "Los Angeles"
    budget_share: 0.107  # LA ≈8–10%, normalized to 4-region sim (was 0.09)
    annual_capital_bn: 21.4  # Billions USD, consistent with 10.7% of $200B total

    weights:
      revenue: 0.8
      growth: 1.0
      charisma: 1.4        # LA values brand/charisma
      vision: 1.2
      traction_quality: 0.9
      repeat_founder: 0.8
      geo_flex: 0.6

    domain_preferences:
      ai: 0.8
      bio: 0.5
      consumer: 1.7        # Strong consumer/media preference
      enterprise: 0.9

    hype_beta: 1.3         # High hype elasticity (narrative-driven)

    stage_mix:
      seed: 0.30
      series_a: 0.40
      series_b_plus: 0.30

    check_sizes:
      seed: 2.0
      series_a: 11.0
      series_b_plus: 30.0

    check_sigma:
      seed: 0.32
      series_a: 0.28
      series_b_plus: 0.22

    domain_mult:
      ai: 1.00
      bio: 0.90
      consumer: 1.10
      enterprise: 0.95

    notes: |
      LA ecosystem focused on consumer, media, entertainment tech, and creator economy.
      Values brand-building, storytelling, and celebrity/influencer connections.
      Growing but still smaller than traditional hubs.
      Source: PitchBook LA Market Report 2024

# Robustness check regions (for later analysis)
